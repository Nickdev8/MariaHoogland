name: mariahoogland.nl
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mariahoogland.nl:prod
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: "3040"
      HOST: "0.0.0.0"
    env_file:
      - app/.env
    user: 1000:1000
    working_dir: /app
    volumes:
      - ./storage:/app/storage
