name: mariahoogland.nl
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mariahoogland.nl:prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
    env_file:
      - app/.env
    user: 1000:1000
    ports:
      - "127.0.0.1:3040:3000"
    working_dir: /app
    volumes:
      - ./storage:/app/storage
